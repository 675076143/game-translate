[package]
name = "game-translate"
version = "0.3.6"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
libwayshot = { version = "0.9", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1.0"
strsim = "0.11"

[profile.release]
lto = "thin"
strip = true
